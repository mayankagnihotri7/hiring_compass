services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: hiring_compass
      POSTGRES_PASSWORD: password
      POSTGRES_DB: hiring_compass_development
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine

  app:
    build: .
    command: bash -c "rm -f tmp/pids/server.pid && rails db:create db:migrate db:seed && rails s -b 0.0.0.0"
    volumes:
      - .:/app
    ports:
      - "3000:3000"
    depends_on:
      - db
      - redis
    environment:
      DATABASE_URL: postgres://hiring_compass:password@db:5432/hiring_compass_development
      REDIS_URL: redis://redis:6379/0
      RAILS_ENV: development

  sidekiq:
    build: .
    command: bundle exec sidekiq
    volumes:
      - .:/app
    depends_on:
      - db
      - redis
    environment:
      DATABASE_URL: postgres://hiring_compass:password@db:5432/hiring_compass_development
      REDIS_URL: redis://redis:6379/0
      RAILS_ENV: development

volumes:
  postgres_data:
